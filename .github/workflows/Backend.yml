name: Deploy Python to AWS Lambda
on:
  push:
    branches:
      - main
    paths:
      - '**backend/registerform_final.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # ✅ Latest supported Lambda runt

      - name: Zip only the source code
        run: |
          cd "backend"   # ✅ cd into the correct folder first
          zip deployment.zip registerform_final.py
         

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload zip to AWS Lambda
        run: |
          cd "backend"
          aws lambda update-function-code --function-name lognform1 --zip-file fileb://./deployment.zip
          
